name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: 60-second quickstart smoke
        run: npm run demo:quickstart
      - name: UI-006 reproducible false-convergence benchmark
        run: npm run benchmark:ui006
